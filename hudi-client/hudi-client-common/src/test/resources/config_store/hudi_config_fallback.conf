# Fallback configurations for testing
# These configs are applied ONLY if not already set by the user

# Default cleaner policy if not specified
hoodie.cleaner.policy=KEEP_LATEST_COMMITS

# Default commits to retain if not specified
hoodie.cleaner.commits.retained=10

# Default archive settings
hoodie.keep.min.commits=20
hoodie.keep.max.commits=30

# A key that will be set by user in tests to verify fallback behavior
hoodie.test.fallback.key=fallback_value
