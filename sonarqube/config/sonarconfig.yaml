schema:
  version: 1

sonarw_output_dir: 'sonarqube' # Non-overridable

connection: # Non-overridable
  sonarqube:
    production:
      udg_path: 'udg://sonarqube-udg'
      zones:
        - 'dca11'
        - 'dca4'
    staging:
      udg_path: 'udg://sonarqube-udg-staging'
      zones:
        - 'dca11'
        - 'dca4'

sonarqube:
  approval_ticket: "https://t3.uberinternal.com/browse/SONARQUBE-985"
  sources:
    - "**/*.java"
#    - "**/*.scala"
  source_exclusions:
    - "**/src/test/**/*"
    - "hudi-aws/**/*"
    - "hudi-examples/**/*"
    - "hudi-flink-datasource/**/*"
    - "hudi-client/hudi-flink-client/**/*"
    - "hudi-kafka-connect/**/*"
    - "hudi-gcp/**/*"
    - "hudi-integ-test/**/*"
    - "hudi-sync/hudi-adb-sync/**/*"
    - "hudi-sync/hudi-datahub-sync/**/*"
    - "hudi-spark-datasource/hudi-spark/src/main/resources/**"
    - "hudi-spark-datasource/hudi-spark/src/main/scala/org/apache/spark/sql/hudi/runner/**"
    - "hudi-spark-datasource/hudi-spark2/**/*"
    - "hudi-spark-datasource/hudi-spark2-common/**/*"
    - "hudi-spark-datasource/hudi-spark3.0.x/**/*"
    - "hudi-spark-datasource/hudi-spark3.1.x/**/*"
    - "hudi-spark-datasource/hudi-spark3.2x/**/*"
    - "hudi-platform-service/hudi-metaserver/**/*"
    - "packaging/**/*"
    - "*.py"
    - "**/target/**/*"
    - "hudi-spark-datasource/hudi-spark3.3.x/target/generated-sources/**/*"
    - "hudi-spark-datasource/hudi-spark/target/generated-sources/**/*"
  static_analysis: # Overridable (addition disallowed)
    # Each language has 2 options:
    #   (a) UberNone  - Disables static analysis and reports only code coverage
    #   (b) UberAll   - Enables static analysis and is noisy since all the rules are enabled
    java: UberAll
    kotlin: UberNone
  unit_test_coverage:
    location: packaging/hudi-codecoverage/target/site/jacoco-aggregate/jacoco.xml    # Path to coverage file
    exclusions:
      file_path_patterns:                   # Overridable (extendable list)
        - "**/src/test/**/*"
        - "*.py"
        # Validators for debugging/testing purposes
        - "hudi-uber/src/main/java/com/uber/hudi/tools/validator/**/*"
        - "hudi-utilities/src/main/java/org/apache/hudi/utilities/HoodieMetadataTableValidator.java"
        - "hudi-utilities/src/main/java/org/apache/hudi/utilities/HoodieDataTableValidator.java"
        - "hudi-utilities/src/main/java/org/apache/hudi/utilities/HoodieDropPartitionsTool.java"
        - "hudi-uber/src/main/java/com/uber/hudi/tools/utils/HoodieToolsUtils.java"
        # Replication Integration test tools for E2E automation testing purposes
        - "hudi-uber/src/main/java/com/uber/hudi/tools/manager/HoodieOperationReplicationIntegTests.java"
        # CLI wrappers over operations that are already unit tested.
        - "hudi-utilities/src/main/java/org/apache/hudi/utilities/TableSizeStats.java"
        - "hudi-utilities/src/main/java/org/apache/hudi/utilities/HudiHiveSyncJob.java"
        - "hudi-cli/src/main/java/org/apache/hudi/cli/commands/BootstrapCommand.java"
        - "hudi-cli/src/main/java/org/apache/hudi/cli/commands/ClusteringCommand.java"
        - "hudi-cli/src/main/java/org/apache/hudi/cli/commands/CompactionCommand.java"
        - "hudi-cli/src/main/java/org/apache/hudi/cli/commands/HDFSParquetImportCommand.java"
        - "hudi-cli/src/main/java/org/apache/hudi/cli/commands/HoodieSyncValidateCommand.java"
        - "hudi-cli/src/main/java/org/apache/hudi/cli/commands/KerberosAuthenticationCommand.java"
        - "hudi-cli/src/main/java/org/apache/hudi/cli/commands/MarkersCommand.java"
        - "hudi-cli/src/main/java/org/apache/hudi/cli/HoodiePrintHelper.java"
        - "hudi-cli/src/main/java/org/apache/hudi/cli/Main.java"
        - "hudi-cli/src/main/java/org/apache/hudi/cli/commands/TempViewCommand.java"
        - "hudi-cli/src/main/java/org/apache/hudi/cli/utils/CommitUtil.java"
        - "hudi-cli/src/main/java/org/apache/hudi/cli/utils/SparkTempViewProvider.java"
        # Untouched from OSS, not used in prod
        - "hudi-utilities/src/main/java/org/apache/hudi/utilities/HoodieCompactionAdminTool.java"
        - "hudi-utilities/src/main/java/org/apache/hudi/utilities/HoodieRepairTool.java"
