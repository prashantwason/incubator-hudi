        # Deprecated OSS classes that have no usage
        - "hudi-cli/src/main/java/org/apache/hudi/cli/HoodiePrompt.java"
        # Deprecated at Uber
        - "hudi-uber/src/main/java/com/uber/hudi/table/services/HoodieSimpleTableService.java"
        - "hudi-uber/src/main/java/com/uber/hudi/table/services/HudiCompactionService.java"
        - "hudi-uber/src/main/java/com/uber/hudi/table/services/TableServicesExecutorJob.java"
        - "hudi-uber/src/main/java/com/uber/hudi/config/manager/TableServicesHDFSBasedConfigManager.java"
      file_content_patterns:
